<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Ship Hull & Cargo Container Geometric Icon -->
  <g transform="translate(32, 33) scale(0.95)" filter="url(#glow)">
    <!-- Base Ship Hull -->
    <path d="M-18 -2 L0 -12 L18 -2 L14 12 L0 18 L-14 12 Z" fill="none" stroke="url(#primaryGrad)" stroke-width="2.5" stroke-linejoin="round"/>
    
    <!-- Top Deck Container Box 1 -->
    <path d="M-12 -6 L0 -12 L12 -6 L0 0 Z" fill="url(#primaryGrad)" opacity="0.9"/>
    
    <!-- Container Side Left -->
    <path d="M-12 -6 L0 0 L0 10 L-12 4 Z" fill="url(#primaryGrad)" opacity="0.6"/>
    
    <!-- Container Side Right -->
    <path d="M0 0 L12 -6 L12 4 L0 10 Z" fill="url(#accentGrad)" opacity="0.75"/>

    <!-- Dynamic Deck Ribs Lines -->
    <line x1="-4" y1="-2" x2="-4" y2="6" stroke="#ffffff" stroke-width="1" opacity="0.5"/>
    <line x1="4" y1="-4" x2="4" y2="4" stroke="#ffffff" stroke-width="1" opacity="0.5"/>
    
    <!-- Glowing Status Node Dot -->
    <circle cx="0" cy="-12" r="2.5" fill="#10b981"/>
  </g>
</svg>
