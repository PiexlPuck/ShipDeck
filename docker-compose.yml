services:
  shipdeck:
    build: .
    container_name: shipdeck
    ports:
      - "8765:8765"
    env_file:
      - path: .env
        required: false
    environment:
      - PORT=8765
      - AUTH_TYPE=none # Change to 'header' to enable Authelia or OIDC proxy protection
    volumes:
      # Mount the host Docker socket so ShipDeck can run docker commands on the host system
      - /var/run/docker.sock:/var/run/docker.sock
      # Mount the data folder for configuration persistence (avoiding directory-creation issues on hosts.json)
      - ./data:/app/data
      # Mount root .env file so host environment variables persist across container rebuilds
      - ./.env:/app/.env
      # Mount projects directory to persist cloned repositories and environment files
      - ./projects:/app/projects
    restart: unless-stopped
